model:
  name: "DGNet"
  backbone: "efficientnet_b0" # or resnet50
  pretrained: true
  
  context_branch:
    out_channels: 256
    
  texture_branch:
    gradient_operator: "sobel" # sobel or scharr
    out_channels: 128
    
  partial_decoder:
    decoder_channels: [256, 128, 64]
    
  loss:
    bce_weight: 1.0
    gradient_loss_weight: 0.5 # lambda balancing hyperparameter
